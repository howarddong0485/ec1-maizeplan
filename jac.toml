[project]
name = "maizeplan"
version = "0.1.0"
description = "A personal coursework planner across web, native mobile and CLI"
default-app = "web"
jac-version = "==0.37.17"

[dependencies]
[dependencies.npm]
react-native-web = "^0.19.13"
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"



[dev-dependencies]
watchdog = ">=3.0.0"

[client]

[apps.web]
kind = "web-app"
entry-point = "web.main"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"

[apps.cli]
kind = "cli"
entry-point = "cli.main"

[serve]
host = "127.0.0.1"

[client.app_meta_data]
title = "MaizePlan | Make room for what matters"
description = "Your coursework, deadlines and focused study plan in one place."
theme_color = "#10284a"
